<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Admin Dashboard</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

</head>

<body>

<div class="container mt-5">

    <h2 class="mb-4">Library Dashboard</h2>

    <div class="row">

        <div class="col-md-4">
            <div class="card bg-primary text-white">
                <div class="card-body">
                    <h5>Total Students</h5>
                    <h3 th:text="${students}"></h3>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card bg-success text-white">
                <div class="card-body">
                    <h5>Total Seats</h5>
                    <h3 th:text="${seats}"></h3>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card bg-warning text-white">
                <div class="card-body">
                    <h5>Total Payments</h5>
                    <h3 th:text="${payments}"></h3>
                </div>
            </div>
        </div>

    </div>

    <hr>

    <a href="/admin/seats" class="btn btn-dark">
        View Seat Layout
    </a>

</div>

</body>
</html>
