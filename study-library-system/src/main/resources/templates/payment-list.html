<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Payments</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

</head>

<body>

<div class="container mt-5">

    <h2>Payment Verification</h2>

    <table class="table table-bordered">

        <thead>

        <tr>

            <th>ID</th>
            <th>Month</th>
            <th>Amount</th>
            <th>Screenshot</th>
            <th>Status</th>
            <th>Action</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="payment : ${payments}">

            <td th:text="${payment.id}"></td>

            <td th:text="${payment.month}"></td>

            <td th:text="${payment.amount}"></td>

            <td>
                <a th:href="@{/${payment.screenshotPath}}" target="_blank">
                    View Screenshot
                </a>
            </td>

            <td th:text="${payment.paymentStatus}"></td>

            <td>

                <a th:href="@{/admin/payments/approve/{id}(id=${payment.id})}"
                   class="btn btn-success btn-sm">
                    Approve
                </a>

                <a th:href="@{/admin/payments/reject/{id}(id=${payment.id})}"
                   class="btn btn-danger btn-sm">
                    Reject
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
