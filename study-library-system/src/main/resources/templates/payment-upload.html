<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Upload Payment</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

</head>

<body>

<div class="container mt-5">

    <h2>Upload Payment Screenshot</h2>

    <form th:action="@{/student/payment/save}"
          method="post"
          enctype="multipart/form-data"
          th:object="${payment}">

        <div class="mb-3">

            <label>Month</label>

            <input type="text" th:field="*{month}" class="form-control"/>

        </div>

        <div class="mb-3">

            <label>Amount</label>

            <input type="number" th:field="*{amount}" class="form-control"/>

        </div>

        <div class="mb-3">

            <label>Upload Screenshot</label>

            <input type="file" name="file" class="form-control"/>

        </div>

        <button class="btn btn-success">
            Submit Payment
        </button>

    </form>

</div>

</body>

</html>
