<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Add Student</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

</head>

<body>

<div class="container mt-5">

    <h2>Add Student</h2>

    <form th:action="@{/admin/students/save}" method="post" th:object="${student}">

        <div class="mb-3">
            <label>Seat Number</label>
            <input type="text" th:field="*{seatNumber}" class="form-control"/>
        </div>

        <div class="mb-3">
            <label>Monthly Fee</label>
            <input type="number" th:field="*{monthlyFee}" class="form-control"/>
        </div>

        <div class="mb-3">
            <label>Subscription Expiry</label>
            <input type="date" th:field="*{subscriptionExpiry}" class="form-control"/>
        </div>

        <button class="btn btn-success">Save</button>

    </form>

</div>

</body>
</html>
