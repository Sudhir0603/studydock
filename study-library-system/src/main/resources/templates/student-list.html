<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Students</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

</head>

<body>

<div class="container mt-5">

    <h2>Students</h2>

    <a href="/admin/students/add" class="btn btn-primary mb-3">
        Add Student
    </a>

    <table class="table table-bordered">

        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Seat</th>
            <th>Monthly Fee</th>
            <th>Expiry</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="student : ${students}">

            <td th:text="${student.id}"></td>
            <td th:text="${student.user.name}"></td>
            <td th:text="${student.seatNumber}"></td>
            <td th:text="${student.monthlyFee}"></td>
            <td th:text="${student.subscriptionExpiry}"></td>

            <td>

                <a th:href="@{/admin/students/delete/{id}(id=${student.id})}"
                   class="btn btn-danger btn-sm">
                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
